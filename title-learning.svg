<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 84" width="1000" height="84" role="img" aria-label="CURRENTLY LEARNING" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#0ea5e9"><animate attributeName="stop-color" values="#0ea5e9;#8b5cf6;#ec4899;#0ea5e9" dur="6s" repeatCount="indefinite"/></stop>
<stop offset="1" stop-color="#ec4899"><animate attributeName="stop-color" values="#ec4899;#0ea5e9;#8b5cf6;#ec4899" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
</defs>
<text x="500" y="38" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="32" font-weight="800" letter-spacing="4" fill="url(#g)">CURRENTLY LEARNING
<animate attributeName="opacity" from="0" to="1" dur=".8s" fill="freeze"/></text>
<text x="500" y="62" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="13" letter-spacing="2" fill="#94a3b8">always levelling up</text>
<rect y="72" height="3" rx="1.5" fill="url(#g)" x="500" width="0">
<animate attributeName="x" values="500;390;390;500" keyTimes="0;.35;.75;1" dur="5s" repeatCount="indefinite"/>
<animate attributeName="width" values="0;220;220;0" keyTimes="0;.35;.75;1" dur="5s" repeatCount="indefinite"/>
</rect>
</svg>