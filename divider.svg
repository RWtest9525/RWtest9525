<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 28" width="1000" height="28" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="c1"><stop offset="0" stop-color="#22d3ee" stop-opacity="0"/><stop offset=".6" stop-color="#22d3ee"/><stop offset="1" stop-color="#fff"/></linearGradient>
<linearGradient id="c2"><stop offset="0" stop-color="#ec4899" stop-opacity="0"/><stop offset=".6" stop-color="#a78bfa"/><stop offset="1" stop-color="#fff"/></linearGradient>
</defs>
<rect x="0" y="13.5" width="1000" height="1" fill="#64748b" opacity=".35"/>
<rect y="12.5" height="3" width="320" rx="1.5" fill="url(#c1)"><animate attributeName="x" from="-320" to="1000" dur="4.5s" repeatCount="indefinite"/></rect>
