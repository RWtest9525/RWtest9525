<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 104" width="1000" height="104" role="img" aria-label="FEATURED PROJECTS">
<defs>
<style>@font-face{font-family:'RWSans';font-weight:400;src:url(data:font/woff;base64,) format('woff');}@font-face{font-family:'RWSans';font-weight:700;src:url(data:font/woff;base64,) format('woff');}</style>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#0ea5e9"><animate attributeName="stop-color" values="#0ea5e9;#8b5cf6;#ec4899;#0ea5e9" dur="6s" repeatCount="indefinite"/></stop>
<stop offset="1" stop-color="#ec4899"><animate attributeName="stop-color" values="#ec4899;#0ea5e9;#8b5cf6;#ec4899" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
</defs>
<text x="500" y="52" text-anchor="middle" font-family="'RWSans','RWMono','Carlito','Segoe UI',Arial,sans-serif" font-size="46" font-weight="700" letter-spacing="3" fill="url(#g)">FEATURED PROJECTS
<animate attributeName="opacity" from="0" to="1" dur=".8s" fill="freeze"/></text>
<text x="500" y="80" text-anchor="middle" font-family="'RWSans','RWMono','Carlito','Segoe UI',Arial,sans-serif" font-size="20" fill="#6b7a90">live data straight from GitHub</text>
<rect y="91" height="4" rx="2" fill="url(#g)" x="500" width="0">
<animate attributeName="x" values="500;385;385;500" keyTimes="0;.35;.75;1" dur="5s" repeatCount="indefinite"/>
<animate attributeName="width" values="0;230;230;0" keyTimes="0;.35;.75;1" dur="5s" repeatCount="indefinite"/>
</rect>
</svg>