<rect x="6" y="6" width="100" height="112" rx="22" fill="none" stroke="#22d3ee" stroke-width="2.5"><animate attributeName="stroke-opacity" values=".4;1;.4" dur="3s" begin="-2.0s" repeatCount="indefinite"/></rect>
